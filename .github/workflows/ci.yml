name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheels keep CI fast; the Kaggle image supplies CUDA builds.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy opencv-python-headless pycocotools albumentations \
                      segmentation-models-pytorch PyYAML pandas pytest ruff
      - name: Lint
        run: ruff check src scripts tests
      - name: Test
        run: pytest -q
