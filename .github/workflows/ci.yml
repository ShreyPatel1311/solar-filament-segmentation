name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Same versions as requirements.txt, so CI can't drift from what
          # actually runs locally/on Kaggle. torch/torchvision come from the
          # CPU index for speed; everything else (smp, timm, pretrainedmodels,
          # albumentations, albucore, ...) is version-pinned there precisely
          # because those packages' own dependency resolution has broken this
          # import chain before (torchvision::nms mismatch, albucore ABI
          # break) when left to "pick latest".
          pip install torch==2.4.0 torchvision==0.19.0 \
                      --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint
        run: ruff check src scripts tests
      - name: Test
        run: pytest -q
