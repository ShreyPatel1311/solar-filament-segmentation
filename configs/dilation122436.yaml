# dilation-122436 from Liu et al. (2021), Solar Physics 296:176.
#
# Best-performing variant in that paper on *high-quality* full-disk Halpha
# images (Table 6: Jac 0.6320 / MCC 0.7829 / F1 0.7710 at 3000 training pairs).
# Trained from random init -- there are no pretrained weights for this
# architecture, so encoder/encoder_weights below are unused.
#
# Caveats worth measuring rather than assuming, both from the same paper:
#   - it is the *worst* variant on low-quality input (Table 8: Jac 0.1090 vs
#     0.4243 for jc), and GONG is ground-based data with noise and artifacts;
#   - on small filaments it trails Enhanced U-Net (Table 7: 0.5792 vs 0.6287),
#     which matters here because barbs are explicitly in scope.
# Run scripts/evaluate.py against configs/unet_resnet34.yaml before committing
# to it -- our metric is instance-level PQ, not their semantic Jaccard.
name: dilation122436

data:
  image_size: 1024
  val_fraction: 0.15
  split_seed: 1311
  num_workers: 2
  limbo_margin: 0.98

model:
  architecture: dilation-122436
  in_channels: 1
  # stages / aspp_rates default to the paper's spec for this variant
  # (3 stages, rates 1 + 12/24/36); set them here only to ablate.
  base_channels: 64
  aspp_fusion: sum      # DeepLab V2 style, as cited; try "concat" as an ablation
  dropout: 0.5
  # The paper only mentions BatchNorm inside ASPP, so this started false to
  # match it -- but from-scratch (no pretrained weights) + this ASPP module's
  # large receptive field (rate 36) + amp=true (fp16 overflows at ~65504) is
  # unstable: logits drift unboundedly within the first few steps and blow up
  # to nan (measured; see the improved-unets model docstring). true adds
  # BatchNorm to the U-Net body, which fixed it in the same test.
  norm: true
  encoder_weights: null
  # ASPP's 4 parallel dilated branches each hold a full-resolution feature
  # map at once (256x256x256ch at image_size 1024, only 2 poolings before
  # ASPP for a 3-stage variant) -- that's the dominant memory cost, and it
  # OOM'd a 15GB GPU at batch_size 4. Recomputing activations in backward
  # instead of storing them cuts peak memory a lot for ~20-30% more time.
  grad_checkpoint: true

train:
  # The paper trains with plain BCE; Dice is kept here because filaments cover
  # well under 1% of a MAGFiLO frame. lr is raised vs the ResNet-34 baseline
  # since nothing is pretrained.
  epochs: 60
  batch_size: 2          # halved from 4 to fit under ASPP's memory footprint
  accumulation_steps: 2  # batch_size x this = effective batch 4, unchanged
  lr: 0.0005   # halved from the from-scratch default as extra margin alongside norm: true
  weight_decay: 0.0001
  amp: true
  bce_weight: 0.5
  dice_weight: 0.5
  grad_clip: 1.0
  seed: 1311

postprocess:
  threshold: 0.5
  min_area: 120
  closing_radius: 3
  dilate_radius: 0
  max_instances: 100
