# Baseline: U-Net / ResNet-34, 1024 px, trained on the union of filament masks.
name: unet_r34

data:
  image_size: 1024
  val_fraction: 0.15
  split_seed: 1311
  num_workers: 2
  limbo_margin: 0.98

model:
  architecture: unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 1

train:
  epochs: 40
  batch_size: 4
  lr: 0.0003
  weight_decay: 0.0001
  amp: true
  bce_weight: 0.5
  dice_weight: 0.5
  grad_clip: 1.0
  seed: 1311

postprocess:
  threshold: 0.5
  min_area: 120
  closing_radius: 3
  dilate_radius: 0
  max_instances: 100
